name: muxon-dev
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: muxon
      POSTGRES_PASSWORD: Infr0n@1234
      POSTGRES_DB: muxon
    ports: ["5432:5432"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: [ "start-dev", "--http-port=8085", "--import-realm" ]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realm-muxon-dev.json:/opt/keycloak/data/import/muxon-dev.json:ro
    ports: ["8085:8085"]

