name: infron-dev
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: infron
      POSTGRES_PASSWORD: infron
      POSTGRES_DB: infron
    ports: ["5432:5432"]

  redis:
    image: redis:8
    ports: ["6379:6379"]

  kafka:
    image: redpandadata/redpanda:v25.2.7
    command:
      - redpanda start --overprovisioned --check=false --node-id=0 --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092 --advertise-kafka-addr PLAINTEXT://kafka:29092,OUTSIDE://localhost:9092
    ports: ["9092:9092"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: [ "start-dev", "--http-port=8085", "--import-realm" ]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realm-infron-dev.json:/opt/keycloak/data/import/infron-dev.json:ro
    ports: ["8085:8080"]

  grafana:
    image: grafana/grafana:12.3.0-18546308611
    ports: ["3000:3000"]

  prometheus:
    image: prom/prometheus:v3.7.0
    ports: ["9090:9090"]
