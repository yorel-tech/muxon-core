infron:
  instanceName: "local"
  instanceId: 19

  # system configuration
  system:
    systemAdminUserName: "admin@infron.dev"
    idp:
      name: "default-idp"
      protocol: "OIDC"            # or SAML2
      metadata:
        # OIDC placeholders
        issuerUri: "http://keycloak:8085/realms/infron-dev"
        clientId: "infron-api"
        clientSecret: "provide-in-secret"

  # new tenants
  tenants:
    - name: "default"
      idpName: "default-idp"
      tenantAdminUserName: "dev@infron.dev"

  datasource:
    url: jdbc:postgresql://postgres:5432/infron
    username: infron
    password: "provide-in-secret"
    driver-class-name: org.postgresql.Driver
