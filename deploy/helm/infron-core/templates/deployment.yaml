apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-services
  labels:
    app: core-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: core-services
  template:
    metadata:
      labels:
        app: core-services
    spec:
      {{- if .Values.bootstrap.initContainerEnabled }}
      initContainers:
        {{- if .Values.postgres.enabled }}
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres {{ .Values.postgres.port }}; do
                echo "waiting for postgres..."
                sleep 2
              done
        {{- end }}
        {{- if .Values.keycloak.enabled }}
        - name: wait-for-keycloak
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z keycloak {{ .Values.keycloak.port }}; do
                echo "waiting for keycloak..."
                sleep 2
              done
        {{- end }}
        - name: bootstrap
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["java", "-jar", "/app/bootstrap.jar"]
          args:
            - --initial-config
            - /bootstrap/initial-config.yaml
            - --output-folder
            - /bootstrap-out
            - --infron-passphrase
            - /run/secrets/{{ .Values.bootstrap.secretKeys.passphrase }}
            - --infron-oidc-secret
            - /run/secrets/{{ .Values.bootstrap.secretKeys.oidcSecret }}
            - --infron-db-password
            - /run/secrets/{{ .Values.bootstrap.secretKeys.dbPassword }}
          volumeMounts:
            - name: initial-config
              mountPath: /bootstrap/initial-config.yaml
              subPath: initial-config.yaml
              readOnly: true
            - name: bootstrap-out
              mountPath: /bootstrap-out
            - name: infron-secrets
              mountPath: /run/secrets
              readOnly: true
      {{- end }}
      containers:
        - name: core-services
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            {{- if .Values.bootstrap.initContainerEnabled }}
            - name: INFRON_SKIP_BOOTSTRAP
              value: "1"
            {{- end }}
          volumeMounts:
            {{- if .Values.bootstrap.initContainerEnabled }}
            - name: bootstrap-out
              mountPath: /etc/infron
            {{- else }}
            - name: initial-config
              mountPath: /etc/infron/initial-config.yaml
              subPath: initial-config.yaml
              readOnly: true
            {{- end }}
            - name: infron-secrets
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: initial-config
          configMap:
            name: {{ include "infron-core.fullname" . }}-initial-config
        {{- if .Values.bootstrap.initContainerEnabled }}
        - name: bootstrap-out
          emptyDir: {}
        {{- end }}
        - name: infron-secrets
          secret:
            secretName: {{ .Values.bootstrap.existingSecret }}
