---
server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"

spring:
  application:
    name: "console-proxy"
  datasource:
    url: "jdbc:postgresql://localhost:5432/infron"
    username: "infron"
    password: "Oln5QcC7iHiLOtVIrfXzbQ=="
    driver-class-name: "org.postgresql.Driver"
  jpa:
    hibernate:
      ddl-auto: "none"
    properties:
      hibernate:
        dialect: "org.hibernate.dialect.PostgreSQLDialect"
  flyway:
    enabled: false

infron:
  instanceName: "local"
  instanceId: 19
  console:
    allowed-origins:
      - "http://localhost:4000"
      - "http://127.0.0.1:4000"
    cleanup-interval-ms: 60000
    trust-all-hypervisor-tls: true

logging:
  level:
    root: "INFO"
    org.springframework: "INFO"
    com.onetattva.infron: "DEBUG"
  file:
    name: "logs/infron-console-proxy.log"
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
