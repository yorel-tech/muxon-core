server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
spring:
  main:
    keep-alive: true
  datasource:
    url: jdbc:postgresql://localhost:5432/infron
    username: infron
    password: infron
    driver-class-name: org.postgresql.Driver
    jpa:
      hibernate:
        ddl-auto: none   # or update/create-drop as you prefer
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/infron-dev
          # Optional: if you want to enforce audience (recommended)
          # We'll add a custom validator in SecurityConfig