infron:
  instanceName: "local"
  instanceId: 19

  # system configuration
  system:
    systemAdminUserName: "admin@infron.dev"
    idp:
      name: "default-idp"
      protocol: "OIDC"            # or SAML2
      metadata:
        # OIDC placeholders
        issuerUri: "http://localhost:8085/realms/infron-dev"
        clientId: "infron-api"
        clientSecret: "provide-in-secrets"
      
  # new tenants
  tenants:
  - name: "default"
    idpName: "default-idp"
    tenantAdminUserName: "dev@infron.dev"

  datasource:
    url: jdbc:postgresql://localhost:5432/infron
    username: infron
    password: infron
    driver-class-name: org.postgresql.Driver

