---
server:
  port: 8081

spring:
  application:
    name: "orchestrator"
  # Default scheduler uses one thread; @Scheduled tasks then run strictly one after another.
  # Long work in one poller (e.g. storage discovery up to 300s, VM provider calls) would starve the other.
  task:
    scheduling:
      pool:
        size: 8
  datasource:
    url: "jdbc:postgresql://localhost:5432/infron"
    username: "infron"
    password: "Oln5QcC7iHiLOtVIrfXzbQ=="
    driver-class-name: "org.postgresql.Driver"
  jpa:
    hibernate:
      ddl-auto: "none"
    properties:
      hibernate:
        dialect: "org.hibernate.dialect.PostgreSQLDialect"

logging:
  level:
    root: "INFO"
    org.springframework: "INFO"
    com.onetattva.infron: "DEBUG"
  file:
    name: "logs/infron-orchestrator.log"
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"

infron:
  instanceName: "local"
  instanceId: 19
  system: null
  tenants: null
  queue:
    backend: "db"
  provider:
    # Default when queue metadata omits executionTimeoutSeconds (must match core-services).
    storage-discovery-execution-timeout-seconds: 300

# gRPC configuration
grpc:
  server:
    port: 9081

# OpenTelemetry configuration
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
