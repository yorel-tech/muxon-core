---
spring:
  main:
    web-application-type: none
  application:
    name: "orchestrator"
  grpc:
    server:
      port: 9090
  # Default scheduler uses one thread; @Scheduled tasks then run strictly one after another.
  # Long work in one poller (e.g. storage discovery up to 300s, VM provider calls) would starve the other.
  task:
    scheduling:
      pool:
        size: 8
  datasource:
    url: "jdbc:postgresql://localhost:5432/muxon"
    username: "muxon"
    password: "Oln5QcC7iHiLOtVIrfXzbQ=="
    driver-class-name: "org.postgresql.Driver"
  jpa:
    hibernate:
      ddl-auto: "none"
    properties:
      hibernate:
        dialect: "org.hibernate.dialect.PostgreSQLDialect"

  flyway:
    enabled: true
    locations: "classpath:db/migration/oss"
    placeholders:
      contentStorageDefaultPath: "/var/lib/muxon/content-libraries"

logging:
  level:
    root: "INFO"
    org.springframework: "INFO"
    com.scal.muxon: "DEBUG"
  file:
    name: "logs/muxon-orchestrator.log"
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"

muxon:
  instanceName: "local"
  instanceId: 19
  enterprise:
    enabled: false
  system: null
  tenants: null
  plugins:
    framework:
      enabled: true
    health:
      interval-seconds: 30
    catalog:
      approval-required: false
    timeouts:
      health-seconds: 5
      reconcile-seconds: 60
      catalog-provision-seconds: 120
      status-query-seconds: 10
    circuit-breaker:
      failure-threshold: 5
      cooldown-seconds: 30
  queue:
    backend: "db"
  worker:
    poll-delay-ms: 5000
    poll-batch-size: 10
    stall-threshold-minutes: 10
  provider:
    # Default when queue metadata omits executionTimeoutSeconds (must match core-services).
    storage-discovery-execution-timeout-seconds: 300

# OpenTelemetry configuration
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
