---
# Spring Boot 4.0.3 Native Configuration
spring:
  # Native image optimizations
  aot:
    enabled: true
  application:
    name: "orchestrator"
  datasource:
    url: "jdbc:postgresql://localhost:5432/infron"
    username: "infron"
    password: "Oln5QcC7iHiLOtVIrfXzbQ=="
    driver-class-name: "org.postgresql.Driver"
  jpa:
    hibernate:
      ddl-auto: "none"
    properties:
      hibernate:
        dialect: "org.hibernate.dialect.PostgreSQLDialect"
        format_sql: true
        use_sql_comments: true

server:
  port: 8081

infron:
  instanceName: "local"
  instanceId: 19
  system: null
  tenants: null
  queue:
    backend: "db"

# OpenTelemetry configuration
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
