---
server:
  port: 8081

spring:
  application:
    name: "orchestrator"
  task:
    scheduling:
      pool:
        size: 8
  datasource:
    url: "jdbc:postgresql://localhost:5432/muxon"
    username: "muxon"
    password: "Infr0n@1234"
    driver-class-name: "org.postgresql.Driver"
  jpa:
    hibernate:
      ddl-auto: "none"
    properties:
      hibernate:
        dialect: "org.hibernate.dialect.PostgreSQLDialect"

logging:
  level:
    root: "INFO"
    org.springframework: "INFO"
    com.scal.muxon: "DEBUG"
  file:
    name: "logs/muxon-orchestrator.log"
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"

muxon:
  instanceName: "local"
  instanceId: 19
  system: null
  tenants: null
  queue:
    backend: "db"

# OpenTelemetry configuration
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
