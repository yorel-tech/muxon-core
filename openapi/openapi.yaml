openapi: 3.0.3
info:
  title: Infron Core API
  version: 0.1.0
  description: Core API resources for tenants (organizations) — CRUD, list with pagination and filters.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  contact:
    name: API Support
    url: http://www.krito.com/support
    email: support@krito.com

servers:
  - url: /api/v1

tags:
- name: Datacenters
  description: Provider datacenter/capacity and settings management
- name: TenantDatacenters
  description: Tenant access grants, per-datacenter quota & feature binding
- name: Tenants
  description: Tenant / Organization lifecycle operations
- name: NodeClusters
  description: Node cluster grouping and management
- name: Nodes
  description: Individual infrastructure node management
- name: Health
  description: Health endpoints
- name: Roles
  description: Role operations for platform and tenant admins
- name: Capabilities
  description: Per-user derived capabilities
- name: Providers
  description: Infrastructure provider management
- name: VMs
  description: Virtual machine management operations
- name: ComputeProfiles
  description: Compute profile (VM spec template) management
- name: System Settings
  description: System and tenant settings management
- name: Tenant Settings
  description: Tenant settings management
- name: VM Management
  description: VM lifecycle management operations under a tenant (`/tenants/{tenantId}/vms`)
- name: Users
  description: User management operations
- name: StorageClasses
  description: Capability-based storage class management
- name: ProviderStorage
  description: Discovered provider storage inventory and sync operations
- name: ContentStorages
  description: Platform content storage backends (local path, NFS mount, or S3) for content library artifacts
- name: PlatformContentLibraries
  description: Platform content library CRUD, sync, replicate, publish to datacenters, and items
- name: ContentItems
  description: Content library item CRUD, upload, and download
- name: TenantContentLibraries
  description: Tenant content library CRUD, publish to datacenters, and items (local libraries only)
- name: Overview
  description: Dashboard aggregate counts for system and tenant scope

components:
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.example.com/oauth/token
          scopes:
            admin: "Full admin access"
            read: "Read-only access"

# Apply security globally: either BearerAuth OR ApiKeyHeader OR OAuth2 (clientCredentials w/ scopes)
security:
  - BearerAuth: []
  - ApiKeyHeader: []
  - OAuth2: ["read"]

paths:
  /healthz:
    get:
      operationId: getHealthStatus
      tags:
        - Health
      summary: Health check
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          $ref: './commons.yaml#/components/responses/BadRequest'

  # Datacenters
  /api/v1/datacenters:
    $ref: './datacenters.yaml#/paths/~1datacenters'
  /api/v1/datacenters/{datacenterId}:
    $ref: './datacenters.yaml#/paths/~1datacenters~1{datacenterId}'
  /api/v1/datacenters/{datacenterId}/settings:
    $ref: './datacenters.yaml#/paths/~1datacenters~1{datacenterId}~1settings'
  /api/v1/datacenters/{datacenterId}/storage-classes:
    $ref: './datacenters.yaml#/paths/~1datacenters~1{datacenterId}~1storage-classes'
  /api/v1/datacenters/{datacenterId}/storage-classes/validate:
    $ref: './datacenters.yaml#/paths/~1datacenters~1{datacenterId}~1storage-classes~1validate'

  # Tenants
  /api/v1/tenants:
    $ref: './tenants.yaml#/paths/~1tenants'
  /api/v1/tenants/mine:
    $ref: './tenants.yaml#/paths/~1tenants~1mine'
  /api/v1/tenants/current:
