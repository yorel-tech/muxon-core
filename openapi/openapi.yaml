openapi: 3.0.3
info:
  title: Infron Core API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      tags:
        - Health
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/projects:
    get:
      tags:
        - Projects
      summary: List projects
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
    post:
      tags:
        - Projects
      summary: Create project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
components:
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
    Project:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        orgId: { type: string }
    ProjectCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        orgId: { type: string }
