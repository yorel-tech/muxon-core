openapi: 3.0.3
info:
  title: Infron Core API
  version: 0.1.0
  description: Core API resources for tenants (organizations) — CRUD, list with pagination and filters.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  contact:
    name: API Support
    url: http://www.onetattva.com/support
    email: support@onetattva.com

servers:
  - url: /api/v1

tags:
- name: Datacenters
  description: Provider datacenter/capacity and settings management
- name: TenantDatacenters
  description: Tenant access grants, per-datacenter quota & feature binding
- name: Tenants
  description: Tenant / Organization lifecycle operations
- name: NodeClusters
  description: Node cluster grouping and management
- name: Nodes
  description: Individual infrastructure node management
- name: Health
  description: Health endpoints
- name: Roles
  description: Role operations for platform and tenant admins
- name: Permissions
  description: Permissions endpoints
- name: Bindings
  description: Role Bindings endpoints
- name: Providers
  description: Infrastructure provider management
- name: VMs
  description: Virtual machine management operations
- name: ComputeProfiles
  description: Compute profile (VM spec template) management
- name: System Settings
  description: System and tenant settings management
- name: Tenant Settings
  description: Tenant settings management
- name: VM Management
  description: VM lifecycle management operations
- name: Users
  description: User management operations

components:
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.example.com/oauth/token
          scopes:
            admin: "Full admin access"
            read: "Read-only access"

# Apply security globally: either BearerAuth OR ApiKeyHeader OR OAuth2 (clientCredentials w/ scopes)
security:
  - BearerAuth: []
  - ApiKeyHeader: []
  - OAuth2: ["read"]

paths:
  /healthz:
    get:
      operationId: getHealthStatus
      tags:
        - Health
      summary: Health check
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          $ref: './commons.yaml#/components/responses/BadRequest'

  # Datacenters
  /api/v1/datacenters:
    $ref: './datacenters.yaml#/paths/~1datacenters'
  /api/v1/datacenters/{datacenterId}:
    $ref: './datacenters.yaml#/paths/~1datacenters~1{datacenterId}'
  /api/v1/datacenters/{datacenterId}/settings:
    $ref: './datacenters.yaml#/paths/~1datacenters~1{datacenterId}~1settings'

  # Tenants
  /api/v1/tenants:
    $ref: './tenants.yaml#/paths/~1tenants'
  /api/v1/tenants/{tenantId}:
    $ref: './tenants.yaml#/paths/~1tenants~1{tenantId}'
  /api/v1/tenants/{tenantId}/settings:
    $ref: './tenants.yaml#/paths/~1tenants~1{tenantId}~1settings'

  # Tenant datacenter grants
  /api/v1/tenants/{tenantId}/datacenters:
    $ref: './datacenters.yaml#/paths/~1tenants~1{tenantId}~1datacenters'
  /api/v1/tenants/{tenantId}/datacenters/{datacenterId}:
    $ref: './datacenters.yaml#/paths/~1tenants~1{tenantId}~1datacenters~1{datacenterId}'
  /api/v1/tenants/{tenantId}/datacenters/{datacenterId}/effective:
    $ref: './datacenters.yaml#/paths/~1tenants~1{tenantId}~1datacenters~1{datacenterId}~1effective'

  # Nodes
  /api/v1/api/nodes:
    $ref: './nodes.yaml#/paths/~1api~1nodes'
  /api/v1/api/nodes/{nodeId}:
    $ref: './nodes.yaml#/paths/~1api~1nodes~1{nodeId}'

  # Node Clusters
  /api/v1/node-clusters:
    $ref: './node_clusters.yaml#/paths/~1api~1node-clusters'
  /api/v1/node-clusters/{clusterId}:
    $ref: './node_clusters.yaml#/paths/~1api~1node-clusters~1{clusterId}'
  /api/v1/node-clusters/{clusterId}/nodes:
    $ref: './node_clusters.yaml#/paths/~1api~1node-clusters~1{clusterId}~1nodes'

  # Node Clusters in Datacenters
  /api/v1/datacenters/{datacenterId}/node-clusters:
    $ref: './node_clusters.yaml#/paths/~1api~1datacenters~1{datacenterId}~1node-clusters'

  # Metadata paths
  /api/v1/tenants/{tenantId}/metadata:
    $ref: './tenants.yaml#/paths/~1tenants~1{tenantId}~1metadata'
  /api/v1/nodes/{nodeId}/metadata:
    $ref: './nodes.yaml#/paths/~1api~1nodes~1{nodeId}~1metadata'
  /api/v1/node-clusters/{clusterId}/metadata:
    $ref: './node_clusters.yaml#/paths/~1api~1node-clusters~1{clusterId}~1metadata'
  /api/v1/datacenters/{datacenterId}/metadata:
    $ref: './datacenters.yaml#/paths/~1datacenters~1{datacenterId}~1metadata'

  # VMs
  /api/v1/vms:
    $ref: './vms_paths.yaml#/paths/~1api~1v1~1vms'
  /api/v1/vms/{vmId}:
    $ref: './vms_paths.yaml#/paths/~1api~1v1~1vms~1{vmId}'
  /api/v1/vms/{vmId}/start:
    $ref: './vms_paths.yaml#/paths/~1api~1v1~1vms~1{vmId}~1start'
  /api/v1/vms/{vmId}/stop:
    $ref: './vms_paths.yaml#/paths/~1api~1v1~1vms~1{vmId}~1stop'
  /api/v1/vms/{vmId}/restart:
    $ref: './vms_paths.yaml#/paths/~1api~1v1~1vms~1{vmId}~1restart'
  /api/v1/vms/{vmId}/suspend:
    $ref: './vms_paths.yaml#/paths/~1api~1v1~1vms~1{vmId}~1suspend'
  /api/v1/vms/{vmId}/resume:
    $ref: './vms_paths.yaml#/paths/~1api~1v1~1vms~1{vmId}~1resume'
  /api/v1/vms/{vmId}/console:
    $ref: './vms_paths.yaml#/paths/~1api~1v1~1vms~1{vmId}~1console'

  # Compute Profiles
  /api/v1/compute-profiles:
    $ref: './compute_profiles.yaml#/paths/~1api~1v1~1compute-profiles'
  /api/v1/compute-profiles/{profileId}:
    $ref: './compute_profiles.yaml#/paths/~1api~1v1~1compute-profiles~1{profileId}'
  /api/v1/compute-profiles/{profileId}/metadata:
    $ref: './compute_profiles.yaml#/paths/~1api~1v1~1compute-profiles~1{profileId}~1metadata'

  # Roles
  /api/v1/roles:
    $ref: './core_rbac.yaml#/paths/~1roles'
  /api/v1/roles/{roleId}:
    $ref: './core_rbac.yaml#/paths/~1roles~1{roleId}'
  /api/v1/roles/{roleId}/bindings:
    $ref: './core_rbac.yaml#/paths/~1roles~1{roleId}~1bindings'
  /api/v1/roles/{roleId}/permissions:
    $ref: './core_rbac.yaml#/paths/~1roles~1{roleId}~1permissions'
  /api/v1/tenants/{tenantId}/roles:
    $ref: './core_rbac.yaml#/paths/~1tenants~1{tenantId}~1roles'
  /api/v1/tenants/{tenantId}/roles/{roleId}:
    $ref: './core_rbac.yaml#/paths/~1tenants~1{tenantId}~1roles~1{roleId}'
  /api/v1/tenants/{tenantId}/roles/{roleId}/bindings:
    $ref: './core_rbac.yaml#/paths/~1tenants~1{tenantId}~1roles~1{roleId}~1bindings'
  /api/v1/tenants/{tenantId}/roles/{roleId}/permissions:
    $ref: './core_rbac.yaml#/paths/~1tenants~1{tenantId}~1roles~1{roleId}~1permissions'
  /api/v1/permissions:
    $ref: './core_rbac.yaml#/paths/~1permissions'
  /api/v1/role-bindings:
    $ref: './core_rbac.yaml#/paths/~1role-bindings'
  /api/v1/role-bindings/{bindingId}:
    $ref: './core_rbac.yaml#/paths/~1role-bindings~1{bindingId}'
  /api/v1/users/{userId}/bindings:
    $ref: './core_rbac.yaml#/paths/~1users~1{userId}~1bindings'

  # System Settings
  /api/v1/system-settings:
    $ref: './system_settings.yaml#/paths/~1api~1v1~1system-settings'
  /api/v1/system-settings/general:
    $ref: './system_settings.yaml#/paths/~1api~1v1~1system-settings~1general'
  /api/v1/system-settings/security:
    $ref: './system_settings.yaml#/paths/~1api~1v1~1system-settings~1security'
  /api/v1/system-settings/notifications:
    $ref: './system_settings.yaml#/paths/~1api~1v1~1system-settings~1notifications'
  /api/v1/system-settings/notifications/test-email:
    $ref: './system_settings.yaml#/paths/~1api~1v1~1system-settings~1notifications~1test-email'
  /api/v1/system-settings/idp:
    $ref: './system_settings.yaml#/paths/~1api~1v1~1system-settings~1idp'
  /api/v1/system-settings/idp/validate:
    $ref: './system_settings.yaml#/paths/~1api~1v1~1system-settings~1idp~1validate'
  /api/v1/system-settings/appearance:
    $ref: './system_settings.yaml#/paths/~1api~1v1~1system-settings~1appearance'

  # Tenant Settings
  /api/v1/tenants/{tenantId}/settings/general:
    $ref: './system_settings.yaml#/paths/~1api~1v1~1tenants~1{tenantId}~1settings~1general'
  /api/v1/tenants/{tenantId}/settings/security:
    $ref: './system_settings.yaml#/paths/~1api~1v1~1tenants~1{tenantId}~1settings~1security'
  /api/v1/tenants/{tenantId}/settings/notifications:
    $ref: './system_settings.yaml#/paths/~1api~1v1~1tenants~1{tenantId}~1settings~1notifications'
  /api/v1/tenants/{tenantId}/settings/appearance:
    $ref: './system_settings.yaml#/paths/~1api~1v1~1tenants~1{tenantId}~1settings~1appearance'

  # Providers
  /api/v1/providers:
    $ref: './providers.yaml#/paths/~1providers'
  /api/v1/providers/{providerId}:
    $ref: './providers.yaml#/paths/~1providers~1{providerId}'
  /api/v1/providers/{providerId}/test:
    $ref: './providers.yaml#/paths/~1providers~1{providerId}~1test'
  /api/v1/providers/{providerId}/capabilities:
    $ref: './providers.yaml#/paths/~1providers~1{providerId}~1capabilities'
  /api/v1/providers/{providerId}/metadata:
    $ref: './providers.yaml#/paths/~1providers~1{providerId}~1metadata'

  # Users
  /api/v1/system-users:
    $ref: './users.yaml#/paths/~1system-users'
  /api/v1/system-users/{userId}:
    $ref: './users.yaml#/paths/~1system-users~1{userId}'
  /api/v1/system-users/{userId}/role:
    $ref: './users.yaml#/paths/~1system-users~1{userId}~1role'
  /api/v1/tenants/{tenantId}/users:
    $ref: './users.yaml#/paths/~1tenants~1{tenantId}~1users'
  /api/v1/tenants/{tenantId}/users/{userId}:
    $ref: './users.yaml#/paths/~1tenants~1{tenantId}~1users~1{userId}'
  /api/v1/idp/{idpId}/users:
    $ref: './users.yaml#/paths/~1idp~1{idpId}~1users'
