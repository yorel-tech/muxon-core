openapi: 3.0.3
info:
  title: Infron Tenant API
  version: 0.1.0
  description: Tenant API for managing organizations
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

components:

  parameters:
    tenantId:
      name: tenantId
      in: path
      description: UUID of the tenant
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    Tenant:
      allOf:
        - $ref: './commons.yaml#/components/schemas/BaseEntity'
        - type: object
          required:
            - status
          properties:
            displayName:
              type: string
              example: "ACME Corporation"
            status:
              type: string
              description: Tenant lifecycle status
              enum:
                - active
                - inactive
                - suspended
              example: active

    TenantCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Unique name/slug for the tenant
          example: "acme-corp"
        displayName:
          type: string
          example: "ACME Corporation"
        metadata:
          $ref: './commons.yaml#/components/schemas/Metadata'

    TenantUpdate:
      type: object
      properties:
        displayName:
          type: string
        contact:
          type: object
          properties:
            email:
              type: string
              format: email
            phone:
              type: string
          additionalProperties: false
        metadata:
          $ref: './commons.yaml#/components/schemas/Metadata'
        status:
          type: string
          enum: [active, inactive, suspended]

    TenantList:
      type: object
      properties:
        total:
          type: integer
          example: 125
        page:
          type: integer
          example: 1
        perPage:
          type: integer
          example: 20
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
            
paths:
  /tenants:
    get:
      tags:
        - Tenants
      summary: List tenants
      description: Returns a paginated list of tenants. Supports basic filtering by name and sorting.
      operationId: listTenants
      security:
        - BearerAuth: []
      parameters:
        - $ref: './commons.yaml#/components/parameters/page'
        - $ref: './commons.yaml#/components/parameters/perPage'
        - $ref: './commons.yaml#/components/parameters/sort'
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Filter by tenant name (exact or partial depending on implementation)
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, inactive, suspended]
          description: Filter by tenant status
      responses:
        '200':
          description: Paginated list of tenants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantList'
              examples:
                sample:
                  value:
                    total: 2
                    page: 1
                    perPage: 20
                    items:
                      - id: "c9b1f1f4-1a2b-4c3d-9e01-0123456789ab"
                        name: "acme-corp"
                        displayName: "ACME Corporation"
                        status: active
                        createdAt: "2025-10-01T12:34:56Z"
                      - id: "d1f2e3d4-5a6b-7c8d-9e00-abcdef123456"
                        name: "globex"
                        displayName: "Globex"
                        status: inactive
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'

    post:
      tags:
        - Tenants
      summary: Create a tenant
      description: Create a new tenant (organization). Returns the created tenant.
      operationId: createTenant
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreate'
            examples:
              createExample:
                value:
                  name: "acme-corp"
                  displayName: "ACME Corporation"
                  contact:
                    email: "admin@acme.example"
                    phone: "+1-555-123-4567"
                  metadata:
                    billing_account: "BA-12345"
      responses:
        '201':
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
              examples:
                created:
                  value:
                    id: "c9b1f1f4-1a2b-4c3d-9e01-0123456789ab"
                    name: "acme-corp"
                    displayName: "ACME Corporation"
                    metadata:
                      billing_account: "BA-12345"
                    status: active
                    createdAt: "2025-10-28T10:00:00Z"
        '400':
          $ref: './commons.yaml#/components/responses/BadRequest'
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'

  /tenants/mine:
    get:
      tags:
        - Tenants
      summary: List tenants accessible to the current user
      description: |
        Returns the list of tenants available to the authenticated user based on
        effective role bindings and scope.
      operationId: getMyTenants
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Tenants accessible to the current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantList'
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'

  /tenants/current:
    get:
      tags:
        - Tenants
      summary: Get current tenant
      description: |
        Returns the tenant context for the authenticated user. Used by the tenant portal
        so the UI can resolve tenantId without calling the provider-scoped list tenants API.
        Pass the tenant slug (chosen at login) as query param when the user has multiple tenants.
      operationId: getCurrentTenant
      security:
        - BearerAuth: []
      parameters:
        - name: slug
          in: query
          required: false
          schema:
            type: string
          description: Tenant name/slug (from login). When provided, returns that tenant if the user has access.
      responses:
        '200':
          description: Current tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'

  /tenants/{tenantId}:
    parameters:
      - $ref: './commons.yaml#/components/parameters/tenantId'

    get:
      tags:
        - Tenants
      summary: Get tenant details
      operationId: getTenant
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
              examples:
                tenant:
                  value:
                    id: "c9b1f1f4-1a2b-4c3d-9e01-0123456789ab"
                    name: "acme-corp"
                    displayName: "ACME Corporation"
                    status: active
                    metadata:
                      region: "eu-west-1"
                    createdAt: "2025-10-01T12:34:56Z"
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'

    put:
      tags:
        - Tenants
      summary: Update tenant
      description: Update entire tenant resource. Provide full TenantUpdate payload (fields not provided may be reset depending on implementation).
      operationId: updateTenant
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdate'
            examples:
              updateExample:
                value:
                  displayName: "ACME Corporation (New)"
                  metadata:
                    region: "eu-west-2"
      responses:
        '200':
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: './commons.yaml#/components/responses/BadRequest'
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'

    patch:
      tags:
        - Tenants
      summary: Partially update tenant
      description: Apply partial changes to tenant (JSON Merge Patch or JSON Patch depending on implementation).
      operationId: patchTenant
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdate'
            examples:
              patchExample:
                value:
                  displayName: "ACME Corporation (New)"
      responses:
        '200':
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: './commons.yaml#/components/responses/BadRequest'
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'

    delete:
      tags:
        - Tenants
      summary: Delete a tenant
      description: Remove a tenant. Implementations may choose soft-delete and return 204.
      operationId: deleteTenant
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Tenant deleted (no content)
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'
  /tenants/{tenantId}/settings:
    get:
      tags:
        - Tenants
      summary: Get tenant settings
      operationId: getTenantSettings
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tenant settings
          content:
            application/json:
              schema:
                $ref: './tenant_settings.yaml#/TenantSettings'
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'

    put:
      tags:
        - Tenants
      summary: Replace tenant settings
      operationId: replaceTenantSettings
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './tenant_settings.yaml#/TenantSettings'
      responses:
        '200':
          description: Updated tenant settings
          content:
            application/json:
              schema:
                $ref: './tenant_settings.yaml#/TenantSettings'
        '400':
          $ref: './commons.yaml#/components/responses/BadRequest'
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'

    patch:
      tags:
        - Tenants
      summary: Partially update tenant settings
      operationId: updateTenantSettings
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './tenant_settings.yaml#/TenantSettings'
      responses:
        '200':
          description: Updated tenant settings
          content:
            application/json:
              schema:
                $ref: './tenant_settings.yaml#/TenantSettings'
        '400':
          $ref: './commons.yaml#/components/responses/BadRequest'
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'

  /tenants/{tenantId}/metadata:
    parameters:
      - $ref: './commons.yaml#/components/parameters/tenantId'
    get:
      tags:
        - Metadata
      summary: Get tenant metadata
      operationId: getTenantMetadata
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Tenant metadata
          content:
            application/json:
              schema:
                $ref: './commons.yaml#/components/schemas/Metadata'
              example:
                region: "eu-west-1"
                billing_account: "BA-12345"
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'
    put:
      tags:
        - Metadata
      summary: Update tenant metadata
      operationId: updateTenantMetadata
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './commons.yaml#/components/schemas/Metadata'
            example:
              region: "eu-west-1"
              billing_account: "BA-12345"
      responses:
        '200':
          description: Updated tenant metadata
          content:
            application/json:
              schema:
                $ref: './commons.yaml#/components/schemas/Metadata'
              example:
                region: "eu-west-1"
                billing_account: "BA-12345"
        '400':
          $ref: './commons.yaml#/components/responses/BadRequest'
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'
