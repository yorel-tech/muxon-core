components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    page:
      name: page
      in: query
      description: Page number (1-based)
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    perPage:
      name: perPage
      in: query
      description: Results per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    sort:
      name: sort
      in: query
      description: Sort expression, e.g. "name" or "-createdAt"
      required: false
      schema:
        type: string

  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          example: "TENANT_NOT_FOUND"
        message:
          type: string
          example: "Tenant not found"
        details:
          type: object
          additionalProperties: true

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            tenantNotFound:
              value:
                code: TENANT_NOT_FOUND
                message: Tenant with id 'c9b1f1f4-...' not found
    Unauthorized:
      description: Missing or invalid auth
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              value:
                code: UNAUTHORIZED
                message: Missing or invalid token
    BadRequest:
      description: Invalid data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            badRequest:
              value:
                code: BAD_REQUEST
                message: Invalid data