components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    tenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Tenant UUID
    projectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Project UUID
    page:
      name: page
      in: query
      description: Page number (1-based)
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    perPage:
      name: perPage
      in: query
      description: Results per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    sort:
      name: sort
      in: query
      description: Sort expression, e.g. "name" or "-createdAt"
      required: false
      schema:
        type: string

  schemas:
    BaseEntity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "3d2a4598-f255-5137-f0ca-0c8abf159850"
        name:
          type: string
          example: "entity-name"
        metadata:
          $ref: '#/components/schemas/Metadata'
        createdAt:
          type: string
          format: date-time
          example: "2025-10-01T12:34:56Z"
        updatedAt:
          type: string
          format: date-time
          example: "2025-10-20T09:10:11Z"

    Metadata:
      type: object
      additionalProperties:
        type: string
      description: Arbitrary key/value metadata
      example:
        key1: "value1"
        key2: "value2"

    EntityReference:
      type: object
      description: >
        Reference object used to describe any Infron entity lie datacenter, tenant, user, role etc.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      example:
        id: "3d2a4598-f255-5137-f0ca-0c8abf159850"
        name: "acme"
    ResourceLimits:
      type: object
      description: >
        Resource limits for a tenant or project. Server must validate that
        project limits do not exceed tenant/datacenter grants.
      properties:
        maxCpus:
          type: integer
          minimum: 0
        maxMemoryGb:
          type: integer
          minimum: 0
        maxStorageGb:
          type: integer
          minimum: 0
        maxVms:
          type: integer
          minimum: 0
        maxVolumes:
          type: integer
          minimum: 0
        maxLoadBalancers:
          type: integer
          minimum: 0

    Error:
      type: object
      properties:
        code:
          type: string
          example: "TENANT_NOT_FOUND"
        message:
          type: string
          example: "Tenant not found"
        details:
          type: object
          additionalProperties: true

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            tenantNotFound:
              value:
                code: TENANT_NOT_FOUND
                message: Tenant with id 'c9b1f1f4-...' not found
    Unauthorized:
      description: Missing or invalid auth
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              value:
                code: UNAUTHORIZED
                message: Missing or invalid token
    BadRequest:
      description: Invalid data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            badRequest:
              value:
                code: BAD_REQUEST
                message: Invalid data
