components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    tenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Tenant UUID
    page:
      name: page
      in: query
      description: Page number (1-based)
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    perPage:
      name: perPage
      in: query
      description: Results per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    sort:
      name: sort
      in: query
      description: Sort expression, e.g. "name" or "-createdAt"
      required: false
      schema:
        type: string

  schemas:
    BaseEntity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "3d2a4598-f255-5137-f0ca-0c8abf159850"
        name:
          type: string
          example: "entity-name"
        description:
          type: string
          example: "entity-name"
        metadata:
          $ref: '#/components/schemas/Metadata'
        _links:
          $ref: '#/components/schemas/Links'
        createdAt:
          type: string
          format: date-time
          example: "2025-10-01T12:34:56Z"
        updatedAt:
          type: string
          format: date-time
          example: "2025-10-20T09:10:11Z"

    Links:
      type: array
      items:
        $ref: '#/components/schemas/Link'
      description: HATEOAS links for available actions

    Link:
      type: object
      properties:
        rel:
          type: string
          description: Relation type (e.g., "self", "edit", "delete")
        href:
          type: string
          description: URL for the action
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE]
          description: HTTP method for the action
        title:
          type: string
          description: Human-readable action name
        enabled:
          type: boolean
          description: Whether the action is available to current user
        reason:
          type: string
          description: Reason why action is disabled (if applicable)

    Metadata:
      type: object
      additionalProperties:
        type: string
      description: Arbitrary key/value metadata
      example:
        key1: "value1"
        key2: "value2"

    EntityReference:
      type: object
      description: >
        Reference object used to describe any Muxon entity lie datacenter, tenant, user, role etc.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          description: Optional description (e.g. datacenter description)
      example:
        id: "3d2a4598-f255-5137-f0ca-0c8abf159850"
        name: "acme"
    ResourceLimits:
      type: object
      description: >
        Resource limits for a tenant. Server must validate that
        tenant limits do not exceed datacenter grants.
      properties:
        maxCpus:
          type: integer
          minimum: 0
        maxMemoryGb:
          type: integer
          minimum: 0
        maxStorageGb:
          type: integer
          minimum: 0
        maxVms:
          type: integer
          minimum: 0
        maxVolumes:
          type: integer
          minimum: 0
        maxLoadBalancers:
          type: integer
          minimum: 0
        storageClassLimitsGb:
          type: object
          description: "Per-storage-class limits in GB (e.g., fast-ssd: 1000, capacity-hdd: 10000)"
          additionalProperties:
            type: integer
            minimum: 0

    Error:
      type: object
      properties:
        code:
          type: string
          example: "TENANT_NOT_FOUND"
        message:
          type: string
          example: "Tenant not found"
        details:
          type: object
          additionalProperties: true

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            tenantNotFound:
              value:
                code: TENANT_NOT_FOUND
                message: Tenant with id 'c9b1f1f4-...' not found
    Unauthorized:
      description: Missing or invalid authorization
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              value:
                code: UNAUTHORIZED
                message: Missing or invalid token
    Forbidden:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              value:
                code: UNAUTHORIZED
                message: Missing or invalid token
    BadRequest:
      description: Invalid data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            badRequest:
              value:
                code: BAD_REQUEST
                message: Invalid data
    Conflict:
      description: Resource already exists or business rule conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            conflict:
              value:
                code: CONFLICT
                message: Resource already exists or operation conflicts with current state
    UnprocessableEntity:
      description: Semantic validation failed (quota, CIDR, capability)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unprocessable:
              value:
                code: UNPROCESSABLE_ENTITY
                message: Validation failed
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            tooManyRequests:
              value:
                code: TOO_MANY_REQUESTS
                message: Rate limit exceeded
