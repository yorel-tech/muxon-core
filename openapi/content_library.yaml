openapi: 3.0.3
info:
  title: Infron Content Library API
  version: 2026-04-01
  description: Content library, item catalog, and system/tenant views.

components:
  parameters:
    libraryId:
      name: libraryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    itemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ContentLibraryType:
      type: string
      enum: [local, remote, subscribed]

    ContentLibraryAccessMode:
      type: string
      enum: [read_only, read_write]

    ContentSyncStatus:
      type: string
      enum: [never_synced, in_progress, synced, failed]

    ContentItemStatus:
      type: string
      enum: [pending, fetching, available, failed]

    ContentType:
      type: string
      enum: [vm_template, iso, script, container_image, helm_chart]

    ContentSourceConfig:
      type: object
      description: Source settings for remote libraries and pull-based items.
      properties:
        type:
          type: string
          enum: [http, https, s3]
        url:
          type: string
        bucket:
          type: string
        prefix:
          type: string
        credentialsRef:
          type: string
      additionalProperties: true

    ContentLibrary:
      allOf:
        - $ref: './commons.yaml#/components/schemas/BaseEntity'
        - type: object
          required: [id, name, type, accessMode, syncStatus]
          properties:
            id:
              type: string
              format: uuid
            type:
              $ref: '#/components/schemas/ContentLibraryType'
            accessMode:
              $ref: '#/components/schemas/ContentLibraryAccessMode'
            tenantId:
              type: string
              format: uuid
              nullable: true
              description: Null for platform-scoped libraries; set for tenant-scoped libraries.
            sourceConfig:
              $ref: '#/components/schemas/ContentSourceConfig'
            storageClassName:
              type: string
              maxLength: 64
            syncStatus:
              $ref: '#/components/schemas/ContentSyncStatus'
            lastSyncedAt:
              type: string
              format: date-time
              nullable: true
            metadata:
              $ref: './commons.yaml#/components/schemas/Metadata'

    ContentLibraryCreate:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1000
        type:
          $ref: '#/components/schemas/ContentLibraryType'
        accessMode:
          $ref: '#/components/schemas/ContentLibraryAccessMode'
        sourceConfig:
          $ref: '#/components/schemas/ContentSourceConfig'
        storageClassName:
          type: string
          maxLength: 64
        metadata:
          $ref: './commons.yaml#/components/schemas/Metadata'
      additionalProperties: false

    ContentLibraryUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1000
        accessMode:
          $ref: '#/components/schemas/ContentLibraryAccessMode'
        sourceConfig:
          $ref: '#/components/schemas/ContentSourceConfig'
        storageClassName:
          type: string
          maxLength: 64
        metadata:
          $ref: './commons.yaml#/components/schemas/Metadata'
      additionalProperties: false

    ContentLibraryList:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        perPage:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContentLibrary'

    ContentItem:
      allOf:
        - $ref: './commons.yaml#/components/schemas/BaseEntity'
        - type: object
          required: [id, libraryId, contentType, fetchStatus]
          properties:
            id:
              type: string
              format: uuid
            libraryId:
              type: string
              format: uuid
            contentType:
              $ref: '#/components/schemas/ContentType'
            version:
              type: string
              maxLength: 128
            sizeBytes:
              type: integer
              format: int64
              minimum: 0
            checksum:
              type: string
              maxLength: 256
            checksumAlgorithm:
              type: string
              maxLength: 32
            sourceUrl:
              type: string
            sourceItemId:
              type: string
              format: uuid
              nullable: true
            fetchStatus:
              $ref: '#/components/schemas/ContentItemStatus'
            lastFetchedAt:
              type: string
              format: date-time
              nullable: true
            metadata:
              $ref: './commons.yaml#/components/schemas/Metadata'

    ContentItemCreate:
      type: object
      required: [name, contentType]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1000
        contentType:
          $ref: '#/components/schemas/ContentType'
        version:
          type: string
          maxLength: 128
        checksum:
          type: string
          maxLength: 256
        checksumAlgorithm:
          type: string
          maxLength: 32
        sourceUrl:
          type: string
        sourceItemId:
          type: string
          format: uuid
        metadata:
          $ref: './commons.yaml#/components/schemas/Metadata'
      additionalProperties: false

    ContentItemUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1000
        version:
          type: string
          maxLength: 128
        checksum:
          type: string
          maxLength: 256
        checksumAlgorithm:
          type: string
          maxLength: 32
        sourceUrl:
          type: string
        metadata:
          $ref: './commons.yaml#/components/schemas/Metadata'
      additionalProperties: false

    ContentItemList:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        perPage:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContentItem'

    ContentSyncResponse:
      type: object
      required: [status]
      properties:
        libraryId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        status:
          type: string
          enum: [accepted, completed, failed]
        syncedCount:
          type: integer
          minimum: 0
        message:
          type: string

    ContentFetchResponse:
      type: object
      required: [status]
      properties:
        itemId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        status:
          type: string
          enum: [accepted, completed, failed]
        message:
          type: string

