openapi: 3.0.3
info:
  title: Infron Content Library API
  version: 2026-04-01
  description: Content library, item catalog, and system/tenant views.

components:
  parameters:
    libraryId:
      name: libraryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    itemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    uploadId:
      name: uploadId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    datacenterId:
      name: datacenterId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ContentLibraryType:
      type: string
      enum: [local, remote]

    ContentLibraryAccessMode:
      type: string
      enum: [read_only, read_write]

    ContentSyncStatus:
      type: string
      enum: [never_synced, in_progress, synced, failed]

    ContentItemStatus:
      type: string
      enum: [pending, replicating, available, failed]

    ContentType:
      type: string
      enum: [vm_template, iso, script, container_image, helm_chart]

    ContentSourceConfig:
      type: object
      description: Source settings for remote libraries and pull-based items.
      properties:
        type:
          type: string
          enum: [http, https, s3, nfs]
        url:
          type: string
        bucket:
          type: string
        prefix:
          type: string
        credentialsRef:
          type: string
      additionalProperties: true

    ContentLibrary:
      allOf:
        - $ref: './commons.yaml#/components/schemas/BaseEntity'
        - type: object
          required: [id, name, type, accessMode, syncStatus, contentStorageId]
          properties:
            id:
              type: string
              format: uuid
            type:
              $ref: '#/components/schemas/ContentLibraryType'
            accessMode:
              $ref: '#/components/schemas/ContentLibraryAccessMode'
            tenantId:
              type: string
              format: uuid
              description: >
                Platform libraries use the system tenant id (215012d9-8b1e-5dc5-b54f-89022875fe1e).
                Tenant libraries use the owning tenant id.
            sourceConfig:
              $ref: '#/components/schemas/ContentSourceConfig'
            contentStorageId:
              type: string
              format: uuid
              description: Content store backing uploads and downloads for this library.
            syncStatus:
              $ref: '#/components/schemas/ContentSyncStatus'
            lastSyncedAt:
              type: string
              format: date-time
              nullable: true
            metadata:
              $ref: './commons.yaml#/components/schemas/Metadata'

    ContentLibraryCreate:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1000
        type:
          $ref: '#/components/schemas/ContentLibraryType'
        accessMode:
          $ref: '#/components/schemas/ContentLibraryAccessMode'
        sourceConfig:
          $ref: '#/components/schemas/ContentSourceConfig'
        contentStorageId:
          type: string
          format: uuid
          description: >
            Platform libraries must set this to a ContentStorage id. Tenant library APIs ignore this field
            and always use the system default ContentStorage.
        metadata:
          $ref: './commons.yaml#/components/schemas/Metadata'
      additionalProperties: false

    ContentLibraryUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1000
        accessMode:
          $ref: '#/components/schemas/ContentLibraryAccessMode'
        sourceConfig:
          $ref: '#/components/schemas/ContentSourceConfig'
        contentStorageId:
          type: string
          format: uuid
          description: Platform libraries only; tenant updates ignore this (default storage).
        metadata:
          $ref: './commons.yaml#/components/schemas/Metadata'
      additionalProperties: false

    ContentLibraryList:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        perPage:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContentLibrary'

    ContentItem:
      allOf:
        - $ref: './commons.yaml#/components/schemas/BaseEntity'
        - type: object
          required: [id, libraryId, contentType, contentStatus]
          properties:
            id:
              type: string
              format: uuid
            libraryId:
              type: string
              format: uuid
            contentType:
              $ref: '#/components/schemas/ContentType'
            version:
              type: string
              maxLength: 128
            sizeBytes:
              type: integer
              format: int64
              minimum: 0
            checksum:
              type: string
              maxLength: 256
            checksumAlgorithm:
              type: string
              maxLength: 32
            sourceUrl:
              type: string
            sourceItemId:
              type: string
              format: uuid
              nullable: true
            contentStatus:
              $ref: '#/components/schemas/ContentItemStatus'
            lastReplicatedAt:
              type: string
              format: date-time
              nullable: true
            metadata:
              $ref: './commons.yaml#/components/schemas/Metadata'
            providerRelativePath:
              type: string
              nullable: true
              readOnly: true
              description: Relative path under the provider storage pool when materialized (infron-.../content-libraries/...).
            infronInstanceSegment:
              type: string
              maxLength: 64
              nullable: true
              readOnly: true
              description: infron-{instanceName}-{instanceId} segment captured when the path was assigned.

    ContentItemCreate:
      type: object
      required: [name, contentType]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1000
        contentType:
          $ref: '#/components/schemas/ContentType'
        version:
          type: string
          maxLength: 128
        checksum:
          type: string
          maxLength: 256
        checksumAlgorithm:
          type: string
          maxLength: 32
        sourceUrl:
          type: string
        sourceItemId:
          type: string
          format: uuid
        metadata:
          $ref: './commons.yaml#/components/schemas/Metadata'
      additionalProperties: false

    ContentItemUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1000
        version:
          type: string
          maxLength: 128
        checksum:
          type: string
          maxLength: 256
        checksumAlgorithm:
          type: string
          maxLength: 32
        sourceUrl:
          type: string
        metadata:
          $ref: './commons.yaml#/components/schemas/Metadata'
      additionalProperties: false

    ContentItemList:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        perPage:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContentItem'

    ContentSyncResponse:
      type: object
      required: [status]
      properties:
        libraryId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        status:
          type: string
          enum: [accepted, completed, failed]
        syncedCount:
          type: integer
          minimum: 0
        message:
          type: string

    ContentReplicateResponse:
      type: object
      required: [status]
      properties:
        libraryId:
          type: string
          format: uuid
        datacenterId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        status:
          type: string
          enum: [accepted, completed, failed]
        message:
          type: string

    PublishRequest:
      type: object
      required: [datacenterId, storageClassName]
      properties:
        datacenterId:
          type: string
          format: uuid
        storageClassName:
          type: string
          description: Datacenter storage class; replication uses provider pools that match this class.
      additionalProperties: false

    ContentLibraryDatacenter:
      type: object
      required: [id, libraryId, datacenterId, replicateStatus, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        libraryId:
          type: string
          format: uuid
        datacenterId:
          type: string
          format: uuid
        storageClassName:
          type: string
          nullable: true
          description: Storage class chosen when this library was published to the datacenter.
        datacenter:
          allOf:
            - $ref: './commons.yaml#/components/schemas/EntityReference'
          description: Resolved datacenter id and display name (populated on read).
        replicateStatus:
          type: string
          enum: [pending, replicating, available, failed]
        lastReplicatedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ContentLibraryDatacenterList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContentLibraryDatacenter'

    ContentItemDownloadLink:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: URL to download the artifact (may be time-limited).

    ContentItemUploadInitiate:
      type: object
      required: [totalSize, checksumAlgorithm, expectedChecksum]
      properties:
        totalSize:
          type: integer
          format: int64
          minimum: 1
        checksumAlgorithm:
          type: string
          description: Currently only sha256 is supported.
        expectedChecksum:
          type: string
          description: Lowercase hex SHA-256 of the full object.
        chunkSizeHint:
          type: integer
          format: int64
          minimum: 1
          description: Optional client chunk size; server may echo as chunkSize in the session.
      additionalProperties: false

    ContentItemUploadSession:
      type: object
      required: [id, status, totalSize, uploadedBytes, checksumAlgorithm, expectedChecksum]
      properties:
        id:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        status:
          type: string
          description: e.g. active, complete, failed
        totalSize:
          type: integer
          format: int64
        chunkSize:
          type: integer
          format: int64
          description: Suggested chunk size in bytes.
        uploadedBytes:
          type: integer
          format: int64
        checksumAlgorithm:
          type: string
        expectedChecksum:
          type: string
        expiresAt:
          type: string
          format: date-time

paths:
  /platform/content-libraries:
    get:
      tags: [PlatformContentLibraries]
      summary: List content libraries
      operationId: listPlatformContentLibraries
      security:
        - BearerAuth: []
      parameters:
        - $ref: './commons.yaml#/components/parameters/page'
        - $ref: './commons.yaml#/components/parameters/perPage'
      responses:
        '200':
          description: Paginated libraries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentLibraryList'
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'
    post:
      tags: [PlatformContentLibraries]
      summary: Create content library
      operationId: createPlatformContentLibrary
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentLibraryCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentLibrary'
        '400':
          $ref: './commons.yaml#/components/responses/BadRequest'
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'

  /platform/content-libraries/{libraryId}:
    parameters:
      - $ref: '#/components/parameters/libraryId'
    get:
      tags: [PlatformContentLibraries]
      summary: Get content library
      operationId: getPlatformContentLibrary
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Content library
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentLibrary'
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'
    put:
      tags: [PlatformContentLibraries]
      summary: Replace content library
      operationId: replacePlatformContentLibrary
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentLibraryUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentLibrary'
        '400':
          $ref: './commons.yaml#/components/responses/BadRequest'
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'
    patch:
      tags: [PlatformContentLibraries]
      summary: Update content library
      operationId: updatePlatformContentLibrary
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentLibraryUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentLibrary'
        '400':
          $ref: './commons.yaml#/components/responses/BadRequest'
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'
    delete:
      tags: [PlatformContentLibraries]
      summary: Delete content library
      operationId: deletePlatformContentLibrary
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'

  /platform/content-libraries/{libraryId}/sync:
    parameters:
      - $ref: '#/components/parameters/libraryId'
    post:
      tags: [PlatformContentLibraries]
      summary: Sync remote catalog metadata into stub content items (remote libraries only)
      operationId: syncPlatformContentLibrary
      security:
        - BearerAuth: []
      responses:
        '202':
          description: Sync accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentSyncResponse'
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'

  /platform/content-libraries/{libraryId}/replicate:
    parameters:
      - $ref: '#/components/parameters/libraryId'
    post:
      tags: [PlatformContentLibraries]
      summary: Replicate remote artifacts into Infron content store (remote libraries only)
      operationId: replicatePlatformContentLibrary
      security:
        - BearerAuth: []
      responses:
        '202':
          description: Replicate accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentReplicateResponse'
        '400':
          $ref: './commons.yaml#/components/responses/BadRequest'
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'

  /platform/content-libraries/{libraryId}/publish:
    parameters:
      - $ref: '#/components/parameters/libraryId'
    post:
      tags: [PlatformContentLibraries]
      summary: Publish content library to a datacenter (availability)
      operationId: publishPlatformContentLibrary
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '201':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentLibraryDatacenter'
        '400':
          $ref: './commons.yaml#/components/responses/BadRequest'
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'

  /platform/content-libraries/{libraryId}/datacenters:
    parameters:
      - $ref: '#/components/parameters/libraryId'
    get:
      tags: [PlatformContentLibraries]
      summary: List datacenters this library is published to
      operationId: listPlatformContentLibraryDatacenters
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Mappings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentLibraryDatacenterList'
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'

  /platform/content-libraries/{libraryId}/datacenters/{datacenterId}:
    parameters:
      - $ref: '#/components/parameters/libraryId'
      - $ref: '#/components/parameters/datacenterId'
    delete:
      tags: [PlatformContentLibraries]
      summary: Unpublish library from datacenter
      operationId: unpublishPlatformContentLibraryDatacenter
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Unpublished
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'

  /platform/content-libraries/{libraryId}/datacenters/{datacenterId}/replicate:
    parameters:
      - $ref: '#/components/parameters/libraryId'
      - $ref: '#/components/parameters/datacenterId'
    post:
      tags: [PlatformContentLibraries]
      summary: Replicate content from content store to provider storage at datacenter
      operationId: replicatePlatformContentLibraryDatacenter
      security:
        - BearerAuth: []
      responses:
        '202':
          description: Replicate accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentReplicateResponse'
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'

  /platform/content-libraries/{libraryId}/items:
    parameters:
      - $ref: '#/components/parameters/libraryId'
    get:
      tags: [ContentItems]
      summary: List content items by library
      operationId: listPlatformContentItemsByLibrary
      security:
        - BearerAuth: []
      parameters:
        - $ref: './commons.yaml#/components/parameters/page'
        - $ref: './commons.yaml#/components/parameters/perPage'
      responses:
        '200':
          description: Paginated items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentItemList'
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'
    post:
      tags: [ContentItems]
      summary: Create content item in library
      operationId: createPlatformContentItem
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentItemCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentItem'
        '400':
          $ref: './commons.yaml#/components/responses/BadRequest'
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'

  /platform/content-libraries/{libraryId}/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/libraryId'
      - $ref: '#/components/parameters/itemId'
    get:
      tags: [ContentItems]
      summary: Get content item
      operationId: getPlatformContentItem
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Content item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentItem'
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'
    put:
      tags: [ContentItems]
      summary: Replace content item
      operationId: replacePlatformContentItem
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentItemUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentItem'
        '400':
          $ref: './commons.yaml#/components/responses/BadRequest'
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'
    patch:
      tags: [ContentItems]
      summary: Update content item
      operationId: updatePlatformContentItem
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentItemUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentItem'
        '400':
          $ref: './commons.yaml#/components/responses/BadRequest'
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'
    delete:
      tags: [ContentItems]
      summary: Delete content item
      operationId: deletePlatformContentItem
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'

  /platform/content-libraries/{libraryId}/items/{itemId}/download:
    parameters:
      - $ref: '#/components/parameters/libraryId'
      - $ref: '#/components/parameters/itemId'
    get:
      tags: [ContentItems]
      summary: Get a download link for the content item (client machine)
      operationId: downloadPlatformContentItem
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Download URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentItemDownloadLink'
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'

  /platform/content-libraries/{libraryId}/items/{itemId}/uploads:
    parameters:
      - $ref: '#/components/parameters/libraryId'
      - $ref: '#/components/parameters/itemId'
    post:
      tags: [ContentItems]
      summary: Start binary upload for a content item
      operationId: initiatePlatformContentItemUpload
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentItemUploadInitiate'
      responses:
        '201':
          description: Upload session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentItemUploadSession'
        '400':
          $ref: './commons.yaml#/components/responses/BadRequest'
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'

  /platform/content-libraries/{libraryId}/items/{itemId}/uploads/{uploadId}:
    parameters:
      - $ref: '#/components/parameters/libraryId'
      - $ref: '#/components/parameters/itemId'
      - $ref: '#/components/parameters/uploadId'
    get:
      tags: [ContentItems]
      summary: Get upload session status
      operationId: getPlatformContentItemUploadSession
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentItemUploadSession'
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'
    put:
      tags: [ContentItems]
      summary: Upload a chunk (application/octet-stream, Content-Range bytes start-end/total)
      operationId: putPlatformContentItemUploadChunk
      security:
        - BearerAuth: []
      parameters:
        - name: Content-Range
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Chunk stored
        '308':
          description: Resume incomplete (client should GET session and continue)
        '400':
          $ref: './commons.yaml#/components/responses/BadRequest'
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'

  /platform/content-libraries/{libraryId}/items/{itemId}/uploads/{uploadId}/complete:
    parameters:
      - $ref: '#/components/parameters/libraryId'
      - $ref: '#/components/parameters/itemId'
      - $ref: '#/components/parameters/uploadId'
    post:
      tags: [ContentItems]
      summary: Finalize upload after all bytes are received
      operationId: completePlatformContentItemUpload
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Upload verified and artifact stored
        '400':
          $ref: './commons.yaml#/components/responses/BadRequest'
        '401':
