components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    VmStatus:
      type: string
      enum:
        - PENDING
        - PLANNED
        - PROVISIONING
        - ACTIVE
        - STOPPED
        - SUSPENDED
        - ERROR
        - DELETING
        - DELETED
        - MIGRATING
        - RESIZING
      description: Current lifecycle status of the VM

    VmPowerState:
      type: string
      enum:
        - UNKNOWN
        - ON
        - OFF
        - SUSPENDED
      description: Current power state of the VM

    VmSpec:
      type: object
      required:
        - compute
        - storage
      properties:
        compute:
          $ref: '#/components/schemas/ComputeSpec'
        storage:
          $ref: '#/components/schemas/StorageSpec'
        network:
          $ref: '#/components/schemas/NetworkSpec'
        os:
          $ref: '#/components/schemas/OsSpec'

    ComputeSpec:
      type: object
      required:
        - cpus
        - memorySizeMb
      properties:
        cpus:
          type: integer
          minimum: 1
          maximum: 128
          description: Number of CPUs for the VM
        memorySizeMb:
          type: integer
          minimum: 512
          maximum: 1048576
          description: Memory size in MB

    DiskSpec:
      type: object
      required:
        - sizeMb
      properties:
        sizeMb:
          type: integer
          minimum: 1
          description: Disk size in MB
        storageClass:
          type: string
          description: Storage class for this disk (e.g. ssd, hdd, nvme)

    StorageSpec:
      type: object
      required:
        - disks
      properties:
        disks:
          type: array
          items:
            $ref: '#/components/schemas/DiskSpec'
          description: List of disks attached to the VM
        vmStorageClass:
          type: string
          description: Default VM storage class (applies when disk storageClass is not set)

    NicSpec:
      type: object
      required:
        - isPrimary
      properties:
        isPrimary:
          type: boolean
          description: Whether this is the primary network interface
        network:
          type: string
          description: Network name or ID
        ip_allocation:
          type: string
          enum: [ dhcp, static, pool ]
          default: dhcp
          description: IP allocation method
        ip_address:
          type: string
          description: Static IP address (when ip_allocation is static)
          nullable: true
        prefix:
          type: integer
          minimum: 1
          maximum: 128
          description: "Network prefix length, e.g. 24 for /24 (required when ip_allocation=static)"
          nullable: true
        gateway:
          type: string
          description: "Default gateway IP (required when ip_allocation=static)"
          nullable: true
        dns_servers:
          type: array
          items:
            type: string
          description: "Per-NIC DNS servers (overrides customization-level dnsServers)"
          nullable: true

    NetworkSpec:
      type: object
      properties:
        nics:
          type: array
          items:
            $ref: '#/components/schemas/NicSpec'
          description: List of network interfaces

    OsSpec:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: [ linux, windows, bsd ]
          description: OS type
        distribution:
          type: string
          description: OS distribution (ubuntu, centos, windows-server)
        version:
          type: string
          description: OS version

    # ── Guest Customization ──────────────────────────────────────────────────────

    NicCustomization:
      type: object
      description: "Per-NIC customization overlay applied during guest customization."
      properties:
        nicId:
          type: string
          description: "Matches the NIC by index (0-based) or template network id."
        ipAllocation:
          type: string
          enum: [dhcp, static]
          default: dhcp
        ipAddress:
          type: string
          nullable: true
          description: "Static IPv4 or IPv6 address (without prefix length)."
        prefix:
          type: integer
          minimum: 1
          maximum: 128
          nullable: true
        gateway:
          type: string
          nullable: true
        dnsServers:
          type: array
          nullable: true
          items:
            type: string

    GuestUser:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        gecos:
          type: string
          nullable: true
        groups:
          type: array
          items:
            type: string
          nullable: true
        shell:
          type: string
          nullable: true
          default: /bin/bash
        sshAuthorizedKeys:
          type: array
          items:
            type: string
          nullable: true
        password:
          type: string
          writeOnly: true
          nullable: true
          description: "Accepted as plain text over TLS; stored encrypted at rest; never returned in API responses."
        sudo:
          type: string
          nullable: true
          description: "sudo rule, e.g. ALL=(ALL) NOPASSWD:ALL"

    LinuxCustomization:
      type: object
      description: "Linux-specific cloud-init customization."
      properties:
        users:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/GuestUser'
        packages:
          type: array
          nullable: true
          items:
            type: string
          description: "Extra packages to install via the distro package manager."
        writeFiles:
          type: array
          nullable: true
          items:
            type: object
            properties:
              path:
                type: string
              content:
                type: string
              permissions:
                type: string
                default: "0644"
              owner:
                type: string
                default: "root:root"
              encoding:
                type: string
                enum: [plain, base64, gz, gz+base64]
                default: plain
        bootcmd:
          type: array
          nullable: true
          items:
            type: string
          description: "Commands run very early in boot, before network is configured (cloud-init bootcmd)."
        runcmd:
          type: array
          nullable: true
          items:
            type: string
          description: "Commands run at the end of cloud-init (after network, users, packages)."
        preScriptItemIds:
          type: array
          nullable: true
          items:
            type: string
            format: uuid
          description: "Content library script items executed before network config (bootcmd stage)."
        postScriptItemIds:
          type: array
          nullable: true
          items:
            type: string
            format: uuid
          description: "Content library script items executed after all config (runcmd/final stage)."

    WindowsDomainJoin:
      type: object
      required: [domain]
      properties:
        domain:
          type: string
          description: "Active Directory domain FQDN, e.g. corp.example.com"
        username:
          type: string
          nullable: true
          description: "Domain join account (UPN or DOMAIN\\user). Defaults to Administrator."
        password:
          type: string
          writeOnly: true
          nullable: true
          description: "Domain join password. Stored encrypted at rest; never returned."
        ou:
          type: string
          nullable: true
          description: "Optional OU path for the computer account, e.g. OU=Servers,DC=corp,DC=example,DC=com"

    WindowsCustomization:
      type: object
      description: "Windows-specific sysprep customization."
      properties:
        adminPassword:
          type: string
          writeOnly: true
          nullable: true
          description: "Local Administrator password. Accepted as plain text over TLS; stored encrypted at rest; never returned."
        productKey:
          type: string
          nullable: true
          description: "Windows product key (KMS keys are safe to include; retail keys should be avoided)."
        joinDomain:
          $ref: '#/components/schemas/WindowsDomainJoin'
          nullable: true
        workgroup:
          type: string
          nullable: true
          description: "Workgroup name (used when joinDomain is not set). Defaults to WORKGROUP."
        locales:
          type: object
          nullable: true
          properties:
            uiLanguage:
              type: string
              default: en-US
            systemLocale:
              type: string
              default: en-US
            userLocale:
              type: string
              default: en-US
            inputLocale:
              type: string
              default: 0409:00000409
        autoLogonCount:
          type: integer
          minimum: 0
          default: 0
          nullable: true
          description: "Number of times to auto-logon after first boot (for running firstLogonCommands). 0 = disabled."
        firstLogonCommands:
          type: array
          nullable: true
          items:
            type: string
          description: "PowerShell or cmd commands run as firstLogonCommands in the oobeSystem pass."
        preScriptItemIds:
          type: array
          nullable: true
          items:
            type: string
            format: uuid
          description: "Content library script items executed in the specialize pass (before OOBE)."
        postScriptItemIds:
          type: array
          nullable: true
          items:
            type: string
            format: uuid
          description: "Content library script items executed via firstLogonCommands (after domain join)."

    VmCustomizationSpec:
      type: object
      description: "Guest customization applied at deploy time. Merged over template defaults."
      properties:
        hostname:
          type: string
          minLength: 1
          maxLength: 63
          nullable: true
          description: "Guest hostname. Defaults to vm.name. Max 15 chars for Windows (NetBIOS limit)."
        domain:
          type: string
          nullable: true
          description: "DNS domain suffix appended to the hostname."
        timezone:
          type: string
          nullable: true
          description: "Guest timezone, e.g. UTC, Europe/London, America/New_York."
        dnsServers:
          type: array
          nullable: true
          items:
            type: string
          description: "Global DNS servers applied to all NICs (unless overridden per NIC)."
        dnsSearch:
          type: array
          nullable: true
          items:
            type: string
        nics:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/NicCustomization'
          description: "Per-NIC network customization overlay."
        linux:
          $ref: '#/components/schemas/LinuxCustomization'
          nullable: true
        windows:
          $ref: '#/components/schemas/WindowsCustomization'
          nullable: true

    CustomizationPhase:
      type: string
      enum:
        - NONE
        - PENDING
        - SEED_BUILT
        - WAITING_AGENT
        - IN_PROGRESS
        - COMPLETE
        - FAILED
      description: >
        NONE: no customization configured.
        PENDING: ISO not yet built.
        SEED_BUILT: seed ISO written; VM not yet started.
        WAITING_AGENT: VM running; waiting for QEMU guest agent.
        IN_PROGRESS: QEMU guest agent online; cloud-init or sysprep running.
        COMPLETE: all stages done; IP/hostname confirmed; seed cleaned up.
        FAILED: timeout or guest-reported error.

    CustomizationStatus:
      type: object
      description: "Current guest customization phase and timestamps."
      properties:
        phase:
          $ref: '#/components/schemas/CustomizationPhase'
        subPhase:
          type: string
          nullable: true
          description: "Fine-grained sub-phase (Linux only): NETWORK_CONFIG, CONFIG, SCRIPTS_PRE, SCRIPTS_POST."
        message:
          type: string
          nullable: true
          description: "Human-readable status message or last error."
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        seedPath:
          type: string
          nullable: true
          readOnly: true
          description: "Internal path of the seed ISO (present until COMPLETE; omitted in API responses)."

    Vm:
      allOf:
        - $ref: './commons.yaml#/components/schemas/BaseEntity'
        - type: object
          required:
            - status
            - tenant_datacenter_grant_id
          properties:
            tenant_datacenter_grant_id:
              type: string
              format: uuid
              description: Tenant datacenter grant ID
            spec:
              $ref: '#/components/schemas/VmSpec'
            status:
              $ref: '#/components/schemas/VmStatus'
            power_state:
              $ref: '#/components/schemas/VmPowerState'
            provider_id:
              type: string
              format: uuid
              nullable: true
              description: Provider ID
            node_id:
              type: string
              format: uuid
              nullable: true
              description: Node ID where VM is hosted
            external_id:
              type: string
              nullable: true
              description: Provider's VM ID
            ip_addresses:
              type: array
              items:
                type: string
                format: ipv4
              description: VM IP addresses
            hostname:
              type: string
              nullable: true
              description: VM hostname
            resource_usage:
              $ref: '#/components/schemas/VmResourceUsage'
            content_item_id:
              type: string
              format: uuid
              nullable: true
              description: Content library item used as VM image/template source.
            attached_iso_item_ids:
              type: array
              items:
                type: string
                format: uuid
              description: Content library ISO items attached to this VM.
            tags:
              type: array
              items:
                type: string
              description: VM tags
            started_at:
              type: string
              format: date-time
              nullable: true
              description: When VM first became ACTIVE
            stopped_at:
              type: string
              format: date-time
              nullable: true
              description: Last time VM was stopped
            customization_status:
              $ref: '#/components/schemas/CustomizationStatus'
              nullable: true
              description: Current guest customization phase. Null when no customization is configured.

    VmCreateRequest:
      type: object
      required:
        - name
        - spec
        - tenant_datacenter_grant_id
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 63
          description: VM name
        spec:
          $ref: '#/components/schemas/VmSpec'
        tenant_datacenter_grant_id:
          type: string
          format: uuid
          description: Tenant datacenter grant ID
        content_item_id:
          type: string
          format: uuid
          description: Optional content item reference to materialize before deployment.
        iso_content_item_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Optional ISO content items to attach at creation.
        metadata:
          $ref: './commons.yaml#/components/schemas/Metadata'
        tags:
          type: array
          items:
            type: string
          description: VM tags
        customization:
          $ref: '#/components/schemas/VmCustomizationSpec'
          nullable: true
          description: >
            Guest customization to apply at first boot. Merged over template defaults.
            Secrets (passwords) are write-only: accepted over TLS, encrypted at rest, never returned.

    VmUpdateRequest:
      type: object
      properties:
        description:
          type: string
          maxLength: 255
          description: VM description
        metadata:
          $ref: './commons.yaml#/components/schemas/Metadata'
        tags:
          type: array
          items:
            type: string
          description: VM tags
        content_item_id:
          type: string
          format: uuid
          description: Optional content item reference override.

    VmListResponse:
      type: object
      required:
        - total
        - page
        - per_page
        - total_pages
        - items
      properties:
        total:
          type: integer
          description: Total number of VMs
        page:
          type: integer
          description: Current page number
        per_page:
          type: integer
          description: Items per page
        total_pages:
          type: integer
          description: Total number of pages
        items:
          type: array
          items:
            $ref: '#/components/schemas/Vm'
          description: VM list

    VmCreateResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: VM ID
        name:
          type: string
          description: VM name
        status:
          $ref: '#/components/schemas/VmStatus'
        message:
          type: string
          description: Status message
        created_at:
          type: string
          format: date-time
          description: Creation timestamp

    VmOperationResponse:
      type: object
      properties:
        message:
          type: string
          description: Operation message
        operation_id:
          type: string
          format: uuid
          description: Operation ID for tracking

    VmConsoleResponse:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: WebSocket URL for the console proxy (noVNC / SPICE client connects here)
        token:
          type: string
          description: Access token
        expires_at:
          type: string
          format: date-time
          description: Token expiration time
        console_type:
          type: string
          enum: [VNC, SPICE, SERIAL]
          description: Hypervisor console protocol
        remote_password:
          type: string
          description: >
            One-time password for RFB/SPICE authentication from the browser to the VM (short-lived).
            Required for raw relay; transmit only over HTTPS/WSS in production.

    VmIsoAttachRequest:
      type: object
      required:
        - content_item_id
      properties:
        content_item_id:
          type: string
          format: uuid
          description: Content library ISO item to attach.

    VmIsoDetachRequest:
      type: object
      required:
        - device_name
      properties:
        device_name:
          type: string
          description: Guest device to detach (e.g. sdc).

    VmPublishTemplateRequest:
      type: object
      required:
        - library_id
        - template_name
      properties:
        library_id:
          type: string
          format: uuid
        template_name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1000
        version_label:
          type: string
          maxLength: 128
        metadata:
          $ref: './commons.yaml#/components/schemas/Metadata'

    VmPublishTemplateResponse:
      type: object
      properties:
        content_item_id:
          type: string
          format: uuid
        message:
          type: string

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error code
        message:
          type: string
          description: Error message
        details:
          type: object
          additionalProperties: true
          description: Error details
        request_id:
          type: string
          format: uuid
          description: Request ID for tracing

    VmResourceUsage:
      type: object
      properties:
        cpu:
          type: object
          properties:
            utilized_cores:
              type: integer
              format: int32
              description: CPU cores currently utilized
            utilization_percent:
              type: integer
              format: int32
              minimum: 0
              maximum: 100
              description: CPU utilization percentage
        memory:
          type: object
          properties:
            utilized_mb:
              type: integer
              format: int32
              description: Memory currently utilized in MB
            utilization_percent:
              type: integer
              format: int32
              minimum: 0
              maximum: 100
              description: Memory utilization percentage
        storage:
          type: array
          items:
            type: object
            properties:
              device:
                type: string
                description: Storage device identifier
              utilized_gb:
                type: integer
                format: int32
                description: Storage currently utilized in GB
              utilization_percent:
                type: integer
                format: int32
                minimum: 0
                maximum: 100
                description: Storage utilization percentage
        network:
          type: array
          items:
            type: object
            properties:
              interface:
                type: string
                description: Network interface identifier
              bytes_in:
                type: integer
                format: int64
                description: Bytes received
              bytes_out:
                type: integer
                format: int64
                description: Bytes sent
