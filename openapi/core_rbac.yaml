openapi: 3.0.3
info:
  title: Core RBAC shared schemas
  version: "1.0.0"
  description: >
    Role-binding request/response shapes shared by Users APIs.
    Role and capability paths live in roles_capabilities.yaml; full RBAC CRUD is in muxon-nexus.

paths: {}

components:
  schemas:
    RoleBinding:
      type: object
      properties:
        id:
          type: string
          format: uuid
        roleName:
          type: string
          description: Built-in or enterprise role name (e.g. tenant:admin)
        subjectType:
          type: string
          example: user
        subjectId:
          type: string
        scopeType:
          type: string
          example: tenant
        scopeId:
          type: string
          format: uuid
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    RoleBindingCreateItem:
      type: object
      required:
        - roleName
        - subjectType
        - subjectId
        - scopeType
      properties:
        roleName:
          type: string
        subjectType:
          type: string
          enum: [user, group, service_account]
        subjectId:
          type: string
        scopeType:
          type: string
          enum: [system, tenant, tenant_global]
        scopeId:
          type: string
          format: uuid
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true

    RoleBindingBulkCreate:
      type: object
      required:
        - bindings
      properties:
        bindings:
          type: array
          items:
            $ref: "#/components/schemas/RoleBindingCreateItem"

    RoleBindingList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RoleBinding"
        total:
          type: integer
        page:
          type: integer
        perPage:
          type: integer
