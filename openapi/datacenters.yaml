openapi: 3.0.3
info:
  title: Infron Datacenters & Tenant Grants API
  version: 2025-11-03
  description: Datacenter/provider capability definitions and Tenant→Datacenter grant (quotas & feature access) management.

components:
  parameters:
    dcId:
      name: datacenterId
      in: path
      required: true
      description: Datacenter UUID
      schema:
        type: string
        format: uuid

  schemas:
    DatacenterCapacity:
      type: object
      properties:
        totalCpus:
          type: integer
          minimum: 1
          description: Total number of CPUs available
        totalMemoryGb:
          type: integer
          minimum: 1
          description: Total memory in GB
        totalStorageGb:
          type: integer
          minimum: 1
          description: Total storage in GB
        availableCpus:
          type: integer
          minimum: 0
          description: Available CPUs (calculated)
        availableMemoryGb:
          type: integer
          minimum: 0
          description: Available memory in GB (calculated)
        availableStorageGb:
          type: integer
          minimum: 0
          description: Available storage in GB (calculated)
        usedCpus:
          type: integer
          minimum: 0
          description: Used CPUs (calculated)
        usedMemoryGb:
          type: integer
          minimum: 0
          description: Used memory in GB (calculated)
        usedStorageGb:
          type: integer
          minimum: 0
          description: Used storage in GB (calculated)

    DatacenterSettings:
      type: object
      description: Provider-side defaults & capability descriptors for a datacenter. Overcommit ratios are enterprise-only (infron-nexus).
      properties:
        providerType:
          $ref: './providers.yaml#/components/schemas/ProviderType'
          description: Provider type of the backing cluster
          readOnly: true
        vmClasses:
          type: array
          items:
            type: string
          description: Available VM classes
        storageClasses:
          type: array
          items:
            type: string
          description: Available storage classes
        networkDomains:
          type: array
          items:
            type: string
          description: Available network domains
        providerSpecificSettings:
          type: object
          additionalProperties: true
          description: Provider-specific settings

    Datacenter:
      allOf:
        - $ref: './commons.yaml#/components/schemas/BaseEntity'
        - type: object
          properties:
            capacity:
              $ref: '#/components/schemas/DatacenterCapacity'
            settings:
              $ref: '#/components/schemas/DatacenterSettings'
            nodeCluster:
              $ref: './commons.yaml#/components/schemas/EntityReference'

    DatacenterCreate:
      type: object
      required:
        - name
        - nodeClusterId
        - capacity
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 1000
        nodeClusterId:
          type: string
          format: uuid
          description: UUID of the node cluster that backs this datacenter
        capacity:
          $ref: '#/components/schemas/DatacenterCapacity'
        settings:
          $ref: '#/components/schemas/DatacenterSettings'

    DatacenterUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 1000
        capacity:
          $ref: '#/components/schemas/DatacenterCapacity'
        settings:
          $ref: '#/components/schemas/DatacenterSettings'

    DatacenterList:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        perPage:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/Datacenter'

    DatacenterFeature:
      type: string
      enum: [ k8s, loadBalancer, publicIp, snapshots ]

    TenantDatacenterGrant:
      type: object
      required:
        - id
        - tenant
        - datacenter
      properties:
        id:
          type: string
          format: uuid
        tenant:
          $ref: './commons.yaml#/components/schemas/EntityReference'
        datacenter:
          $ref: './commons.yaml#/components/schemas/EntityReference'
        access:
          type: boolean
          description: Whether tenant has access to the datacenter
          default: true
        limits:
          $ref: './commons.yaml#/components/schemas/ResourceLimits'
        enabledFeatures:
          type: array
          items:
            $ref: '#/components/schemas/DatacenterFeature'
        overrideSettings:
          $ref: '#/components/schemas/DatacenterSettings'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TenantDatacenterGrantCreate:
      type: object
      required:
        - tenantId
        - datacenterId
      properties:
        tenantId:
          type: string
          format: uuid
        datacenterId:
          type: string
          format: uuid
        access:
          type: boolean
          default: true
        limits:
          $ref: './commons.yaml#/components/schemas/ResourceLimits'
        enabledFeatures:
          type: array
          items:
            $ref: '#/components/schemas/DatacenterFeature'
        overrideSettings:
          $ref: '#/components/schemas/DatacenterSettings'

    TenantDatacenterGrantList:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        perPage:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/TenantDatacenterGrant'

    StorageClassWarning:
      type: object
      properties:
        storageClass:
          type: string
          description: Storage class name
        message:
          type: string
          description: Warning or error message
        severity:
          type: string
          enum: [WARNING, ERROR]
          description: Severity level

    StorageClassValidationResult:
      type: object
      properties:
        valid:
          type: boolean
          description: Whether all storage classes are valid
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/StorageClassWarning'
          description: List of warnings or errors
        availableStorageClasses:
          type: array
          items:
            type: string
          description: List of available storage classes

    StorageUsage:
      type: object
      properties:
        storageClass:
          type: string
          description: Storage class name
        usedGb:
          type: integer
          format: int64
          description: Used storage in GB
        limitGb:
          type: integer
          format: int64
          description: Storage limit in GB
        utilizationPercent:
          type: number
          format: double
          description: Utilization percentage

paths:

  # Datacenter management
  /datacenters:
    get:
      tags: [Datacenters]
      summary: List datacenters
      operationId: listDatacenters
      security:
        - BearerAuth: []
      parameters:
        - $ref: './commons.yaml#/components/parameters/page'
        - $ref: './commons.yaml#/components/parameters/perPage'
        - name: providerType
          in: query
          schema:
            $ref: './providers.yaml#/components/schemas/ProviderType'
          description: Filter datacenters by provider type (derived from node cluster's provider)
      responses:
        '200':
          description: Paginated datacenter list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatacenterList'
        '403':
          $ref: './commons.yaml#/components/responses/Unauthorized'
    post:
      tags: [Datacenters]
      summary: Create datacenter
      operationId: createDatacenter
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatacenterCreate'
      responses:
        '201':
          description: Created datacenter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Datacenter'
        '400':
          $ref: './commons.yaml#/components/responses/BadRequest'
        '403':
          $ref: './commons.yaml#/components/responses/Unauthorized'

  /datacenters/{datacenterId}:
    parameters:
      - $ref: '#/components/parameters/dcId'
    get:
      tags: [Datacenters]
      summary: Get datacenter
      operationId: getDatacenter
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Datacenter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Datacenter'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'
        '403':
          $ref: './commons.yaml#/components/responses/Unauthorized'
    put:
      tags: [Datacenters]
      summary: Replace datacenter
      operationId: replaceDatacenter
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatacenterUpdate'
      responses:
        '200':
          description: Updated datacenter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Datacenter'
        '400':
          $ref: './commons.yaml#/components/responses/BadRequest'
        '403':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'
    patch:
      tags: [Datacenters]
      summary: Partially update datacenter
      operationId: updateDatacenter
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatacenterUpdate'
      responses:
        '200':
          description: Updated datacenter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Datacenter'
        '400':
          $ref: './commons.yaml#/components/responses/BadRequest'
        '403':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'
    delete:
      tags: [Datacenters]
      summary: Delete datacenter
      operationId: deleteDatacenter
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Deleted
        '403':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'

  # Datacenter settings
  /datacenters/{datacenterId}/settings:
    parameters:
      - $ref: '#/components/parameters/dcId'
    get:
      tags: [Datacenters]
      summary: Get datacenter settings
      operationId: getDatacenterSettings
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Datacenter settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatacenterSettings'
        '403':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'
    put:
      tags: [Datacenters]
      summary: Replace datacenter settings
      operationId: replaceDatacenterSettings
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatacenterSettings'
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatacenterSettings'
        '400':
          $ref: './commons.yaml#/components/responses/BadRequest'
        '403':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'
    patch:
      tags: [Datacenters]
      summary: Partially update datacenter settings
      operationId: updateDatacenterSettings
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatacenterSettings'
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatacenterSettings'
        '400':
          $ref: './commons.yaml#/components/responses/BadRequest'
        '403':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'

  # Datacenter capacity
  /datacenters/{datacenterId}/capacity:
    parameters:
      - $ref: '#/components/parameters/dcId'
    put:
      tags: [Datacenters]
      summary: Update datacenter capacity
      operationId: updateDatacenterCapacity
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatacenterCapacity'
      responses:
        '200':
          description: Updated capacity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatacenterCapacity'
        '400':
          $ref: './commons.yaml#/components/responses/BadRequest'
        '403':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'

  # Datacenter metadata
  /datacenters/{datacenterId}/metadata:
    parameters:
      - $ref: '#/components/parameters/dcId'
    get:
      tags:
        - Metadata
      summary: Get datacenter metadata
      operationId: getDatacenterMetadata
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Datacenter metadata
          content:
            application/json:
              schema:
                $ref: './commons.yaml#/components/schemas/Metadata'
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'
    put:
      tags:
        - Metadata
      summary: Update datacenter metadata
      operationId: updateDatacenterMetadata
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './commons.yaml#/components/schemas/Metadata'
      responses:
        '200':
          description: Updated metadata
          content:
            application/json:
              schema:
                $ref: './commons.yaml#/components/schemas/Metadata'
        '400':
          $ref: './commons.yaml#/components/responses/BadRequest'
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'

  # Datacenter storage classes
  /datacenters/{datacenterId}/storage-classes:
    parameters:
      - $ref: '#/components/parameters/dcId'
    get:
      tags: [Datacenters]
      summary: List available storage classes for datacenter
      operationId: getDatacenterStorageClasses
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Available storage classes
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '403':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'

  /datacenters/{datacenterId}/storage-classes/validate:
    parameters:
      - $ref: '#/components/parameters/dcId'
    post:
      tags: [Datacenters]
      summary: Validate storage class configuration
      operationId: validateDatacenterStorageClasses
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageClassValidationResult'
        '400':
          $ref: './commons.yaml#/components/responses/BadRequest'
        '403':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'

  # Tenant <-> Datacenter bindings (grants)
  /tenants/{tenantId}/datacenters:
    parameters:
      - $ref: './commons.yaml#/components/parameters/tenantId'
      - $ref: './commons.yaml#/components/parameters/page'
      - $ref: './commons.yaml#/components/parameters/perPage'
    get:
      tags: [TenantDatacenters]
      summary: List datacenters accessible to a tenant (with grants/limits)
      operationId: listTenantDatacenters
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Grants list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantDatacenterGrantList'
        '403':
          $ref: './commons.yaml#/components/responses/Unauthorized'
    post:
      tags: [TenantDatacenters]
      summary: Grant tenant access to datacenter (create or replace)
      operationId: createTenantDatacenterGrant
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantDatacenterGrantCreate'
      responses:
        '201':
          description: Grant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantDatacenterGrant'
        '400':
          $ref: './commons.yaml#/components/responses/BadRequest'
        '403':
          $ref: './commons.yaml#/components/responses/Unauthorized'

  /tenants/{tenantId}/datacenters/{datacenterId}:
    parameters:
      - $ref: './commons.yaml#/components/parameters/tenantId'
      - $ref: '#/components/parameters/dcId'
    get:
      tags: [TenantDatacenters]
      summary: Get tenant grant for a specific datacenter
      operationId: getTenantDatacenterGrant
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Tenant datacenter grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantDatacenterGrant'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'
        '403':
          $ref: './commons.yaml#/components/responses/Unauthorized'
    put:
      tags: [TenantDatacenters]
      summary: Replace tenant datacenter grant
      operationId: replaceTenantDatacenterGrant
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantDatacenterGrant'
      responses:
        '200':
          description: Updated grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantDatacenterGrant'
        '400':
          $ref: './commons.yaml#/components/responses/BadRequest'
        '403':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'
    patch:
      tags: [TenantDatacenters]
      summary: Partially update tenant datacenter grant
      operationId: updateTenantDatacenterGrant
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantDatacenterGrant'
      responses:
        '200':
          description: Updated grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantDatacenterGrant'
        '400':
          $ref: './commons.yaml#/components/responses/BadRequest'
        '403':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'
    delete:
      tags: [TenantDatacenters]
      summary: Revoke tenant access to datacenter
      operationId: deleteTenantDatacenterGrant
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Revoked
        '403':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'

  /tenants/{tenantId}/datacenters/{datacenterId}/effective:
    parameters:
      - $ref: './commons.yaml#/components/parameters/tenantId'
      - $ref: '#/components/parameters/dcId'
    get:
      tags: [TenantDatacenters]
      summary: Get effective settings for tenant in datacenter (merged datacenter defaults + override + tenant global)
      operationId: getTenantDatacenterEffective
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Effective settings & limits
          content:
            application/json:
              schema:
                type: object
                properties:
                  datacenter:
                    $ref: '#/components/schemas/Datacenter'
                  grant:
                    $ref: '#/components/schemas/TenantDatacenterGrant'
                  effectiveSettings:
                    $ref: '#/components/schemas/DatacenterSettings'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'
        '403':
          $ref: './commons.yaml#/components/responses/Unauthorized'

  # Tenant storage classes
  /tenants/{tenantId}/datacenters/{datacenterId}/storage-classes:
    parameters:
      - $ref: './commons.yaml#/components/parameters/tenantId'
      - $ref: '#/components/parameters/dcId'
    get:
      tags: [TenantDatacenters]
      summary: Get effective storage classes for tenant in datacenter
      operationId: getTenantStorageClasses
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Effective storage classes
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '403':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'

  /tenants/{tenantId}/datacenters/{datacenterId}/storage-usage:
    parameters:
      - $ref: './commons.yaml#/components/parameters/tenantId'
      - $ref: '#/components/parameters/dcId'
    get:
      tags: [TenantDatacenters]
      summary: Get storage usage per storage class for tenant
      operationId: getTenantStorageUsage
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Storage usage information
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/StorageUsage'
        '403':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'
