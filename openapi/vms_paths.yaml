      responses:
        '200':
          description: VM resume initiated
          content:
            application/json:
              schema:
                $ref: './vms.yaml#/components/schemas/VmOperationResponse'
        '400':
          $ref: './commons.yaml#/components/responses/BadRequest'
        '401':
          $ref: './commons.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './commons.yaml#/components/responses/Forbidden'
        '404':
          $ref: './commons.yaml#/components/responses/NotFound'
        '409':
          description: VM not suspended
          content:
            application/json:
              schema:
                $ref: './vms.yaml#/components/schemas/Error'

  /api/v1/tenants/{tenantId}/vms/{vmId}/console:
    get:
      tags:
        - VM Management
      summary: Get VM console access
      operationId: getVmConsole
      security:
        - BearerAuth: []
      parameters:
        - $ref: './commons.yaml#/components/parameters/tenantId'
        - name: vmId
          in: path
          required: true
          description: VM ID
          schema:
            type: string
